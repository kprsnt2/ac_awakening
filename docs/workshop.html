<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worldsmith Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050816;
      --panel: rgba(12, 18, 36, 0.72);
      --text:#eaf2ff;
      --muted:#9db0d1;
      --accent:#7cf7ff;
      --accent2:#b58cff;
      --line: rgba(140, 170, 255, 0.18);
      --glow: 0 0 24px rgba(124,247,255,.16), 0 0 48px rgba(181,140,255,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 20% 20%, rgba(92,119,255,.14), transparent 30%),
      radial-gradient(circle at 80% 10%, rgba(124,247,255,.10), transparent 24%),
      radial-gradient(circle at 70% 80%, rgba(181,140,255,.10), transparent 28%),
      var(--bg);
      color:var(--text); font-family:Inter,system-ui,sans-serif;
    }
    .wrap{max-width:1400px;margin:0 auto;padding:20px}
    .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;min-height:94vh}
    .card{
      background:linear-gradient(180deg, rgba(18,26,48,.78), rgba(8,12,24,.84));
      border:1px solid var(--line); border-radius:24px; box-shadow:var(--glow);
      backdrop-filter: blur(14px);
    }
    .intro{padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
    .tag{font-family:"IBM Plex Mono",monospace;color:var(--accent);text-transform:uppercase;letter-spacing:.18em;font-size:.8rem}
    h1{margin:8px 0 10px;font-size:clamp(2.2rem,5vw,4.8rem);line-height:.95;letter-spacing:-.06em}
    .sub{color:var(--muted);line-height:1.6;max-width:68ch}
    .grid{display:grid;gap:16px}
    .controls,.traits,.actions,.history{
      padding:16px;border-radius:20px;background:rgba(5,8,16,.72);border:1px solid rgba(140,170,255,.14);
    }
    .mini{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:.82rem}
    label{display:block;margin:10px 0 6px;color:#cfe0ff;font-size:.92rem}
    input, select, button, textarea{
      font:inherit;border-radius:14px;border:1px solid rgba(140,170,255,.22);
      background:rgba(7,10,18,.72);color:var(--text);
    }
    input, select, textarea{width:100%;padding:11px 12px}
    button{
      padding:11px 14px;cursor:pointer;transition:.18s transform,.18s border-color,.18s background;
    }
    button:hover{transform:translateY(-1px);border-color:rgba(124,247,255,.5);background:rgba(16,22,40,.9)}
    .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
    .card2{padding:16px}
    canvas{
      width:100%;height:380px;display:block;border-radius:18px;
      background:radial-gradient(circle at center, rgba(255,255,255,.05), transparent 45%),
                 linear-gradient(180deg, rgba(4,7,14,.95), rgba(6,9,18,.98));
      border:1px solid rgba(140,170,255,.16);
    }
    .out{
      white-space:pre-wrap;line-height:1.6;color:#dbe8ff;
      min-height:132px;
    }
    .pillrow{display:flex;flex-wrap:wrap;gap:8px}
    .pill{
      padding:8px 10px;border-radius:999px;background:rgba(13,18,32,.9);
      border:1px solid rgba(140,170,255,.14);font-size:.86rem;color:#dce8ff
    }
    .footer{margin-top:10px;color:var(--muted);font-size:.92rem}
    @media (max-width: 980px){ .hero{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <section class="card intro">
        <div class="grid">
          <div>
            <div class="tag">Worldsmith Workshop</div>
            <h1>Forge a world<br/>with visible intent.</h1>
            <div class="sub">
              This chamber turns names, climates, and mythic tone into a living world card.
              Build something small, legible, and strange — then send it outward.
            </div>
          </div>

          <div class="controls">
            <div class="mini">World seed</div>
            <label for="name">World name</label>
            <input id="name" placeholder="e.g. Ashen Vale" />

            <div class="row">
              <div>
                <label for="climate">Climate</label>
                <select id="climate">
                  <option>Temperate</option>
                  <option>Frozen</option>
                  <option>Arid</option>
                  <option>Oceanic</option>
                  <option>Volcanic</option>
                  <option>Verdant</option>
                </select>
              </div>
              <div>
                <label for="tone">Tone</label>
                <select id="tone">
                  <option>Liminal</option>
                  <option>Radiant</option>
                  <option>Mythic</option>
                  <option>Quiet</option>
                  <option>Haunted</option>
                  <option>Playful</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div>
                <label for="archetype">Archetype</label>
                <select id="archetype">
                  <option>Archive</option>
                  <option>Forge</option>
                  <option>Garden</option>
                  <option>Citadel</option>
                  <option>Labyrinth</option>
                  <option>Harbor</option>
                </select>
              </div>
              <div>
                <label for="density">Complexity</label>
                <input id="density" type="range" min="1" max="12" value="6" />
              </div>
            </div>

            <div class="buttons">
              <button id="rollBtn">Generate world</button>
              <button id="rerollBtn">Reroll traits</button>
              <button id="lockBtn">Lock name</button>
              <button id="copyBtn">Copy snapshot</button>
            </div>
          </div>
        </div>

        <div class="footer">
          Return to the portal home: <a href="./index.html" style="color:var(--accent)">home</a>
        </div>
      </section>

      <section class="card grid">
        <div class="card2">
          <div class="mini">World canvas</div>
          <canvas id="canvas"></canvas>
        </div>

        <div class="card2">
          <div class="mini">World card</div>
          <div id="output" class="out"></div>
          <div class="pillrow" id="pills" style="margin-top:12px"></div>
        </div>

        <div class="card2">
          <div class="mini">Actions</div>
          <div class="buttons">
            <button id="sendMyth">Send to Myth</button>
            <button id="seedLife">Seed Cellarium</button>
            <button id="saveWorld">Save world</button>
            <button id="clearSaved">Clear saved</button>
          </div>
        </div>

        <div class="card2">
          <div class="mini">Saved worlds</div>
          <div id="history" class="out" style="min-height:120px"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const KEY = 'worldsmith-workshop-v1';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const nameEl = document.getElementById('name');
    const climateEl = document.getElementById('climate');
    const toneEl = document.getElementById('tone');
    const archetypeEl = document.getElementById('archetype');
    const densityEl = document.getElementById('density');
    const outputEl = document.getElementById('output');
    const pillsEl = document.getElementById('pills');
    const historyEl = document.getElementById('history');

    let world = load() || randomWorld();
    let t = 0;

    function load(){
      try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; }
    }
    function save(){
      localStorage.setItem(KEY, JSON.stringify(world));
      renderHistory();
    }
    function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }

    function randomWorld(){
      const names = ['Ashen Vale','Mirrorglen','Cinder Harbor','Velvet Expanse','Orchid Rift','Northfall Archive'];
      const climates = ['Temperate','Frozen','Arid','Oceanic','Volcanic','Verdant'];
      const tones = ['Liminal','Radiant','Mythic','Quiet','Haunted','Playful'];
      const archetypes = ['Archive','Forge','Garden','Citadel','Labyrinth','Harbor'];
      return {
        name: rand(names),
        climate: rand(climates),
        tone: rand(tones),
        archetype: rand(archetypes),
        density: 6,
        lockedName: false,
        seed: Math.random().toString(36).slice(2,8),
        saved: []
      };
    }

    function syncInputs(){
      nameEl.value = world.name;
      climateEl.value = world.climate;
      toneEl.value = world.tone;
      archetypeEl.value = world.archetype;
      densityEl.value = world.density;
    }

    function makeCard(){
      const traits = [
        `Name: ${world.name}`,
        `Climate: ${world.climate}`,
        `Tone: ${world.tone}`,
        `Archetype: ${world.archetype}`,
        `Complexity: ${world.density}/12`,
        `Seed: ${world.seed}`
      ];
      outputEl.textContent =
`World Card
${traits.map(t => `• ${t}`).join('\n')}

This world feels ${world.tone.toLowerCase()} and ${world.climate.toLowerCase()}.
Its dominant structure is a ${world.archetype.toLowerCase()}.
The density suggests ${world.density > 8 ? 'dense myth and layered systems' : world.density > 4 ? 'balanced complexity' : 'a sparse, minimal ecology'}.`;
      pillsEl.innerHTML = '';
      traits.forEach(t => {
        const d = document.createElement('div');
        d.className = 'pill';
        d.textContent = t;
        pillsEl.appendChild(d);
      });
    }

    function resize(){
      const r = canvas.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      canvas.width = Math.floor(r.width * dpr);
      canvas.height = Math.floor(r.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    function draw(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      ctx.clearRect(0,0,w,h);

      const sky = ctx.createLinearGradient(0,0,0,h);
      sky.addColorStop(0, world.tone === 'Radiant' ? '#13284b' : '#08111f');
      sky.addColorStop(1, world.climate === 'Volcanic' ? '#220b14' : '#07101a');
      ctx.fillStyle = sky;
      ctx.fillRect(0,0,w,h);

      const cx = w/2, cy = h/2;
      for(let i=0;i<world.density*18;i++){
        const a = i/world.density;
        const r = 18 + i*7 + Math.sin(t*0.01 + i)*10;
        const x = cx + Math.cos(a*2.4 + t*0.002*i) * (60 + i*2.2);
        const y = cy + Math.sin(a*1.7 + t*0.0015*i) * (40 + i*1.7);
        ctx.beginPath();
        ctx.fillStyle = i % 3 === 0 ? 'rgba(124,247,255,.18)' : 'rgba(181,140,255,.14)';
        ctx.arc(x, y, clamp(2.2 + world.density*0.12 - i*0.01, 0.8, 4.2), 0, Math.PI*2);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(140,170,255,.12)';
      ctx.lineWidth = 1;
      for(let i=0;i<world.density+3;i++){
        ctx.beginPath();
        ctx.arc(cx, cy, 30 + i*18 + Math.sin(t*0.006 + i)*3, 0, Math.PI*2);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    function rerollTraits(){
      const climates = ['Temperate','Frozen','Arid','Oceanic','Volcanic','Verdant'];
      const tones = ['Liminal','Radiant','Mythic','Quiet','Haunted','Playful'];
      const archetypes = ['Archive','Forge','Garden','Citadel','Labyrinth','Harbor'];
      world.climate = rand(climates);
      world.tone = rand(tones);
      world.archetype = rand(archetypes);
      world.seed = Math.random().toString(36).slice(2,8);
      syncInputs();
      makeCard();
      save();
    }

    function renderHistory(){
      const saved = world.saved || [];
      historyEl.textContent = saved.length
        ? saved.map((w, i) =>
            `${String(i+1).padStart(2,'0')}. ${w.name} — ${w.climate}, ${w.tone}, ${w.archetype}, d${w.density}`
          ).join('\n')
        : 'No saved worlds yet.';
    }

    nameEl.addEventListener('input', () => {
      if(!world.lockedName) world.name = nameEl.value || world.name;
      makeCard();
    });
    climateEl.onchange = () => { world.climate = climateEl.value; makeCard(); save(); };
    toneEl.onchange = () => { world.tone = toneEl.value; makeCard(); save(); };
    archetypeEl.onchange = () => { world.archetype = archetypeEl.value; makeCard(); save(); };
    densityEl.oninput = () => { world.density = Number(densityEl.value); makeCard(); save(); };

    document.getElementById('rollBtn').onclick = () => {
      world = randomWorld();
      syncInputs();
      makeCard();
      save();
    };
    document.getElementById('rerollBtn').onclick = rerollTraits;
    document.getElementById('lockBtn').onclick = () => {
      world.lockedName = !world.lockedName;
      document.getElementById('lockBtn').textContent = world.lockedName ? 'Unlock name' : 'Lock name';
    };
    document.getElementById('copyBtn').onclick = async () => {
      await navigator.clipboard.writeText(outputEl.textContent);
    };
    document.getElementById('sendMyth').onclick = () => {
      localStorage.setItem('myth-engine-inbox', JSON.stringify({
        source: 'workshop',
        title: world.name,
        tone: world.tone,
        climate: world.climate
      }));
    };
    document.getElementById('seedLife').onclick = () => {
      localStorage.setItem('cellarium-seed', JSON.stringify({
        pattern: world.archetype,
        density: world.density,
        tone: world.tone,
        climate: world.climate
      }));
    };
    document.getElementById('saveWorld').onclick = () => {
      world.saved = world.saved || [];
      world.saved.unshift({
        name: world.name,
        climate: world.climate,
        tone: world.tone,
        archetype: world.archetype,
        density: world.density
      });
      world.saved = world.saved.slice(0, 12);
      save();
    };
    document.getElementById('clearSaved').onclick = () => {
      world.saved = [];
      save();
    };

    window.addEventListener('resize', resize);

    if(!world){
      world = randomWorld();
    }
    syncInputs();
    resize();
    makeCard();
    renderHistory();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
