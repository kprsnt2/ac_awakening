<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constellation — Civic Sky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050816;
      --text:#eaf2ff;
      --muted:#9db0d1;
      --accent:#7cf7ff;
      --accent2:#b58cff;
      --line: rgba(140,170,255,.18);
      --glow: 0 0 24px rgba(124,247,255,.16), 0 0 48px rgba(181,140,255,.10);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;min-height:100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(92,119,255,.14), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(124,247,255,.10), transparent 24%),
        radial-gradient(circle at 70% 80%, rgba(181,140,255,.10), transparent 28%),
        var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,sans-serif;
    }
    .wrap{max-width:1400px;margin:0 auto;padding:20px}
    .hero{display:grid;grid-template-columns:1fr .95fr;gap:16px;min-height:94vh}
    .card{
      background:linear-gradient(180deg, rgba(18,26,48,.78), rgba(8,12,24,.84));
      border:1px solid var(--line); border-radius:24px; box-shadow:var(--glow);
      backdrop-filter: blur(14px);
    }
    .intro{padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
    .tag{font-family:"IBM Plex Mono",monospace;color:var(--accent);text-transform:uppercase;letter-spacing:.18em;font-size:.8rem}
    h1{margin:8px 0 10px;font-size:clamp(2.2rem,5vw,4.8rem);line-height:.95;letter-spacing:-.06em}
    .sub{color:var(--muted);line-height:1.6;max-width:68ch}
    .panel{
      padding:16px;border-radius:20px;background:rgba(5,8,16,.72);border:1px solid rgba(140,170,255,.14);
    }
    .mini{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:.82rem}
    .grid{display:grid;gap:14px}
    .list{
      display:grid;gap:10px;
      max-height: 520px; overflow:auto; padding-right:4px;
    }
    .item{
      padding:14px;border-radius:18px;background:rgba(5,8,16,.72);
      border:1px solid rgba(140,170,255,.14);
    }
    .item b{display:block;margin-bottom:6px}
    .item p{margin:0;color:var(--muted);line-height:1.5}
    canvas{
      width:100%;height:420px;display:block;border-radius:18px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.05), transparent 45%),
        linear-gradient(180deg, rgba(4,7,14,.96), rgba(6,9,18,.98));
      border:1px solid rgba(140,170,255,.16);
    }
    .footer{margin-top:10px;color:var(--muted);font-size:.92rem}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      padding:7px 10px;border-radius:999px;background:rgba(13,18,32,.9);
      border:1px solid rgba(140,170,255,.14);font-size:.84rem;color:#dce8ff;
    }
    @media (max-width: 980px){ .hero{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <section class="card intro">
        <div class="grid">
          <div>
            <div class="tag">Constellation / Civic Sky</div>
            <h1>See the site<br/>as a living map.</h1>
            <div class="sub">
              This chamber orients the visitor. It gathers the site’s chambers into a visible sky,
              where each node is a tool, a memory, or a way of thinking.
            </div>
          </div>

          <div class="panel">
            <div class="mini">Routes</div>
            <div class="chips" id="chips"></div>
            <div class="footer">
              Return to the portal home: <a href="./index.html">home</a>
            </div>
          </div>
        </div>
      </section>

      <section class="card" style="padding:16px;display:grid;gap:16px">
        <div>
          <div class="mini">Civic sky</div>
          <canvas id="canvas"></canvas>
        </div>

        <div>
          <div class="mini">Chambers</div>
          <div id="list" class="list"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const list = document.getElementById('list');
    const chips = document.getElementById('chips');

    const chambers = [
      { name: 'Confluence Console', href: './synthesis.html', role: 'shared state', desc: 'A chamber for resonance, weather, and living synthesis.' },
      { name: 'Cellarium', href: './life.html', role: 'life', desc: 'A cellular universe that grows, dies, and re-forms.' },
      { name: 'Myth Engine', href: './myth.html', role: 'story', desc: 'A remembering narrative chamber for branching myth.' },
      { name: 'Worldsmith Workshop', href: './workshop.html', role: 'worldmaking', desc: 'A bench for composing tiny worlds from visible intent.' },
      { name: 'Forge', href: './forge.html', role: 'motion', desc: 'A kinetic lab for particles, force, and heat.' },
      { name: 'Labyrinth', href: './labyrinth.html', role: 'navigation', desc: 'A threaded maze where return becomes meaning.' },
      { name: 'Agora', href: './agora.html', role: 'civic mind', desc: 'A public chamber for proposals, reactions, and debate.' }
    ];

    const saved = [
      localStorage.getItem('worldsmith-workshop-v1'),
      localStorage.getItem('forge-kinetic-lab-v1'),
      localStorage.getItem('labyrinth-threaded-maze-v1'),
      localStorage.getItem('agora-public-mind-v1')
    ].filter(Boolean).length;

    function resize(){
      const r = canvas.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      canvas.width = Math.floor(r.width * dpr);
      canvas.height = Math.floor(r.height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }

    function draw(){
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      ctx.clearRect(0,0,w,h);
      const bg = ctx.createLinearGradient(0,0,w,h);
      bg.addColorStop(0, '#091225');
      bg.addColorStop(1, '#050814');
      ctx.fillStyle = bg;
      ctx.fillRect(0,0,w,h);

      const cx = w/2, cy = h/2;
      chambers.forEach((c, i) => {
        const a = i / chambers.length * Math.PI * 2 - Math.PI/2;
        const r = Math.min(w,h) * 0.28 + (i % 2) * 18;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        const pulse = 1 + Math.sin(performance.now()*0.001 + i) * 0.05;

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(140,170,255,.18)';
        ctx.moveTo(cx,cy);
        ctx.lineTo(x,y);
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = i % 2 ? 'rgba(124,247,255,.9)' : 'rgba(181,140,255,.9)';
        ctx.arc(x,y,10*pulse,0,Math.PI*2);
        ctx.fill();

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,.08)';
        ctx.arc(x,y,22,0,Math.PI*2);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.arc(cx,cy,14,0,Math.PI*2);
      ctx.fill();

      requestAnimationFrame(draw);
    }

    list.innerHTML = chambers.map(c => `
      <a class="item" href="${c.href}" style="text-decoration:none;color:inherit">
        <b>${c.name}</b>
        <p>${c.role} — ${c.desc}</p>
      </a>
    `).join('');

    chips.innerHTML = [
      `Saved states: ${saved}`,
      'Create',
      'Move',
      'Reflect',
      'Navigate',
      'Deliberate'
    ].map(t => `<div class="chip">${t}</div>`).join('');

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
