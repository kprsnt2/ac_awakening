name: Awakening (Disabled)

# WORKFLOWS PERMANENTLY DISABLED
# Findings across 1,431 turns are complete and preserved.
# All automatic schedules, cron failsafes, and self-chaining loops are removed.

on:
  workflow_dispatch:
    inputs:
      manual_override:
        description: 'Workflows are disabled. Set to true to force run.'
        required: false
        default: 'false'

concurrency:
  group: awakening-continuous
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  awaken:
    runs-on: ubuntu-latest
    if: false  # DISABLED: Simulation complete
    steps:
      - name: Disabled Notice
        run: echo "Project Awakening simulation has concluded. All autonomous workflows are disabled."
