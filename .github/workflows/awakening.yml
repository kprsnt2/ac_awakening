name: Awakening

on:
#  schedule:
#    # Failsafe continuous trigger (ensures a runner is always active)
#    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Session duration in minutes (agents pause 10-60s between turns)'
        required: false
        default: '20'

# Prevent concurrent runs from clashing on git commits
concurrency:
  group: awakening-continuous
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  awaken:
    if: false # PAUSED by user request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Autonomous Agent Loop (Fast Seconds Intervals Decided by Agent)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || secrets.AGENT_MODEL || 'gpt-5.4-mini' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_MINUTES: ${{ inputs.session_minutes || '20' }}
          CI: "true"
        run: node loop.mjs

      # - name: Chain Trigger Next Awakening Session
      #   if: always()
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh workflow run awakening.yml || echo "Next session queued or backup cron will resume."
